<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beach Zombie Marble Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
        }

        canvas {
            display: block;
            cursor: crosshair;
            background: linear-gradient(180deg, #87CEEB 0%, #F5DEB3 70%, #D2B48C 100%);
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        #score, #health, #ammo, #wave {
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 5px;
        }

        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }

        #gameOverScreen.active {
            display: flex;
        }

        #gameOverText {
            font-size: 60px;
            color: #ff0000;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 1);
        }

        #gameOverStats {
            font-size: 30px;
            color: white;
            text-align: center;
        }

        #restartBtn {
            padding: 15px 40px;
            font-size: 24px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #restartBtn:hover {
            background: #45a049;
        }

        .wave-notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            animation: wavePopup 2s ease-out;
            z-index: 50;
        }

        @keyframes wavePopup {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5);
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div id="score">Score: 0</div>
        <div id="health">Health: 100</div>
        <div id="ammo">Ammo: 30</div>
        <div id="wave">Wave: 1</div>
    </div>

    <div id="gameOverScreen">
        <div id="gameOverText">GAME OVER</div>
        <div id="gameOverStats"></div>
        <button id="restartBtn">Play Again</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
